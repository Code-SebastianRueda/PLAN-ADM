<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1040" viewBox="0 0 1540 1040" font-family="Segoe UI, Arial, sans-serif">
  <!-- ===================== estilos ===================== -->
  <defs>
    <style>
      .ttl   { fill:#ffffff; font-weight:800; }
      .sub   { fill:#cfe0f5; }
      .h     { fill:#0b2a4a; font-weight:800; }
      .lbl   { fill:#0050A0; font-weight:700; }
      .txt   { fill:#2b3a4a; }
      .muted { fill:#8894a6; }
      .ok    { fill:#1a7a4a; font-weight:700; }
      .card  { fill:#ffffff; stroke:#d9e2ec; stroke-width:1.5; }
      .zone  { fill:#f3f8ff; stroke:#9cc0ea; stroke-width:1.5; stroke-dasharray:5 4; }
      .ec2   { fill:#eef5ff; stroke:#5b93d6; stroke-width:1.5; }
      .inner { fill:#ffffff; stroke:#cfddf0; stroke-width:1.2; }
      .orbit { fill:#0b2a4a; }
      .arr   { stroke:#5b93d6; stroke-width:2.4; fill:none; marker-end:url(#ah); }
      .arr2  { stroke:#0050A0; stroke-width:2.4; fill:none; marker-end:url(#ah2); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b93d6"/>
    </marker>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0050A0"/>
    </marker>
  </defs>

  <rect width="1540" height="1040" fill="#ffffff"/>

  <!-- ===================== cabecera ===================== -->
  <rect x="0" y="0" width="1540" height="92" fill="#0b2a4a"/>
  <!-- nube icono -->
  <path d="M48 56 a16 16 0 0 1 4 -31 a21 21 0 0 1 40 3 a15 15 0 0 1 -3 29 Z"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="108" y="42" class="ttl" font-size="30">Kyndryl Orbit</text>
  <text x="108" y="70" class="sub" font-size="16">Arquitectura en AWS (EC2 + Docker)</text>
  <text x="560" y="38" class="sub" font-size="15">Aplicación de operación multicloud   |   Python + Streamlit</text>
  <text x="560" y="62" class="sub" font-size="15">Despliegue en EC2 con contenedores Docker   |   50 usuarios iniciales</text>
  <text x="1492" y="52" class="ttl" font-size="26" text-anchor="end">kyndryl</text>

  <!-- ===================== Usuarios ===================== -->
  <rect class="card" x="24" y="118" width="150" height="300" rx="10"/>
  <text x="99" y="150" class="h" font-size="15" text-anchor="middle">Usuarios</text>
  <text x="99" y="170" class="muted" font-size="11" text-anchor="middle">(50 personas)</text>
  <text x="99" y="188" class="txt" font-size="11" text-anchor="middle">Operadores Cloud</text>
  <text x="99" y="204" class="txt" font-size="11" text-anchor="middle">L1 / L2 / L3</text>
  <circle cx="99" cy="238" r="15" fill="#0050A0"/>
  <rect class="inner" x="44" y="300" width="110" height="100" rx="8"/>
  <text x="99" y="340" class="txt" font-size="11" text-anchor="middle">Navegador</text>
  <text x="99" y="356" class="txt" font-size="11" text-anchor="middle">Web</text>
  <text x="99" y="376" class="muted" font-size="11" text-anchor="middle">(HTTPS)</text>

  <!-- internet -->
  <circle cx="236" cy="258" r="26" fill="none" stroke="#5b93d6" stroke-width="2"/>
  <text x="236" y="300" class="lbl" font-size="12" text-anchor="middle">Internet</text>
  <line class="arr" x1="176" y1="258" x2="208" y2="258"/>
  <line class="arr" x1="264" y1="258" x2="300" y2="258"/>

  <!-- ===================== GitHub / CI-CD ===================== -->
  <rect class="card" x="302" y="118" width="226" height="430" rx="10"/>
  <text x="330" y="150" class="h" font-size="15">GitHub</text>
  <text x="330" y="168" class="muted" font-size="11">Repositorio del proyecto</text>
  <text x="320" y="196" class="txt" font-size="11.5">• Código fuente</text>
  <text x="320" y="214" class="txt" font-size="11.5">• Dockerfile · docker-compose</text>
  <text x="320" y="232" class="txt" font-size="11.5">• workflows (GitHub Actions)</text>
  <text x="320" y="250" class="txt" font-size="11.5">• requirements.txt</text>

  <rect class="inner" x="320" y="272" width="190" height="258" rx="8"/>
  <text x="338" y="298" class="h" font-size="13">GitHub Actions</text>
  <text x="338" y="314" class="muted" font-size="10.5">CI/CD Pipeline</text>
  <g font-size="11.5" class="txt">
    <circle cx="348" cy="340" r="9" fill="#0050A0"/><text x="344" y="344" fill="#fff" font-size="10">1</text>
    <text x="366" y="344">Build &amp; Test</text>
    <circle cx="348" cy="372" r="9" fill="#0050A0"/><text x="344" y="376" fill="#fff" font-size="10">2</text>
    <text x="366" y="376">Lint / Security Scan</text>
    <circle cx="348" cy="404" r="9" fill="#0050A0"/><text x="344" y="408" fill="#fff" font-size="10">3</text>
    <text x="366" y="408">Build Docker Image</text>
    <circle cx="348" cy="436" r="9" fill="#0050A0"/><text x="344" y="440" fill="#fff" font-size="10">4</text>
    <text x="366" y="440">Push to ECR</text>
    <circle cx="348" cy="468" r="9" fill="#0050A0"/><text x="344" y="472" fill="#fff" font-size="10">5</text>
    <text x="366" y="472">Deploy to EC2</text>
  </g>
  <line class="arr2" x1="528" y1="330" x2="566" y2="330"/>

  <!-- ===================== AWS zona ===================== -->
  <rect class="zone" x="566" y="110" width="784" height="620" rx="12"/>
  <text x="592" y="150" class="h" font-size="20" fill="#ff9900">aws</text>
  <text x="700" y="150" class="muted" font-size="12">Región: us-east-1 (ejemplo)</text>

  <!-- ECR -->
  <rect class="card" x="700" y="166" width="180" height="78" rx="8"/>
  <rect x="716" y="186" width="30" height="30" rx="5" fill="#ff9900"/>
  <text x="756" y="196" class="h" font-size="12.5">Amazon ECR</text>
  <text x="756" y="214" class="muted" font-size="10.5">Repositorio de</text>
  <text x="756" y="228" class="muted" font-size="10.5">imágenes Docker</text>
  <!-- EC2 header -->
  <rect class="card" x="912" y="166" width="188" height="78" rx="8"/>
  <rect x="928" y="186" width="30" height="30" rx="5" fill="#ff9900"/>
  <text x="968" y="196" class="h" font-size="12.5">Amazon EC2</text>
  <text x="968" y="214" class="muted" font-size="10.5">Instancia t3.medium</text>
  <text x="968" y="228" class="muted" font-size="10.5">(Amazon Linux 2023)</text>
  <line class="arr" x1="880" y1="205" x2="910" y2="205"/>

  <!-- EC2 Docker box -->
  <rect class="ec2" x="582" y="262" width="604" height="330" rx="10"/>
  <text x="604" y="290" class="h" font-size="15">EC2 (Docker)</text>
  <text x="604" y="308" class="muted" font-size="11">Contenedores vía docker-compose</text>

  <!-- app container -->
  <rect class="orbit" x="600" y="322" width="150" height="110" rx="8"/>
  <text x="675" y="360" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">Kyndryl Orbit</text>
  <text x="675" y="382" fill="#9ec6f0" font-size="10.5" text-anchor="middle">app · Streamlit</text>
  <text x="675" y="400" fill="#9ec6f0" font-size="10.5" text-anchor="middle">(Python)</text>
  <text x="675" y="418" fill="#cfe0f5" font-size="9.5" text-anchor="middle">puerto 8501</text>

  <!-- servicios dentro del contenedor app -->
  <rect class="inner" x="764" y="322" width="190" height="200" rx="8"/>
  <text x="778" y="344" class="lbl" font-size="11.5">Módulos de la app</text>
  <g font-size="10.5" class="txt">
    <text x="778" y="366">• app.py (UI)</text>
    <text x="778" y="384">• app_auth.py (login)</text>
    <text x="778" y="402">• azure_*.py (7 áreas)</text>
    <text x="778" y="420">• data_cache.py (caché)</text>
    <text x="778" y="438">• cloud_status.py</text>
    <text x="778" y="456">• session_store.py</text>
    <text x="778" y="474">• secrets_provider.py</text>
    <text x="778" y="494" class="muted">+ aws/gcp/oci/ibm (futuro)</text>
  </g>

  <!-- PostgreSQL container -->
  <rect class="inner" x="968" y="322" width="100" height="86" rx="8"/>
  <circle cx="1018" cy="352" r="12" fill="#336791"/>
  <text x="1018" y="378" class="h" font-size="11" text-anchor="middle">PostgreSQL</text>
  <text x="1018" y="394" class="muted" font-size="9" text-anchor="middle">usuarios · sesiones</text>
  <!-- Redis container -->
  <rect class="inner" x="1078" y="322" width="92" height="86" rx="8"/>
  <circle cx="1124" cy="352" r="12" fill="#d82c20"/>
  <text x="1124" y="378" class="h" font-size="11" text-anchor="middle">Redis</text>
  <text x="1124" y="394" class="muted" font-size="9" text-anchor="middle">caché efímera</text>

  <!-- scheduler container -->
  <rect class="inner" x="968" y="420" width="202" height="100" rx="8"/>
  <text x="978" y="442" class="lbl" font-size="11.5">⏰ scheduler</text>
  <text x="978" y="462" class="txt" font-size="10">daily_refresh.py</text>
  <text x="978" y="479" class="txt" font-size="10">Precarga diaria de snapshots</text>
  <text x="978" y="496" class="ok" font-size="10">06:00 Colombia = 11:00 UTC</text>
  <text x="978" y="512" class="muted" font-size="9">(Service Principals por cliente)</text>

  <!-- Volumen EBS para postgres -->
  <rect class="inner" x="600" y="446" width="150" height="76" rx="8"/>
  <text x="675" y="470" class="h" font-size="11" text-anchor="middle">Volumen Docker</text>
  <text x="675" y="488" class="muted" font-size="9.5" text-anchor="middle">PostgreSQL data</text>
  <text x="675" y="504" class="muted" font-size="9.5" text-anchor="middle">(persistencia · EBS)</text>
  <line class="arr2" x1="1018" y1="408" x2="1018" y2="418"/>

  <!-- conexiones a nubes -->
  <rect class="inner" x="600" y="608" width="570" height="104" rx="8"/>
  <text x="620" y="632" class="lbl" font-size="12">Conexiones a otras nubes (desde la EC2)</text>
  <g text-anchor="middle">
    <text x="672" y="672" class="h" font-size="12">Azure</text><text x="672" y="690" class="muted" font-size="10">(APIs · real)</text>
    <text x="782" y="672" class="h" font-size="12">AWS</text><text x="782" y="690" class="muted" font-size="10">(APIs)</text>
    <text x="892" y="672" class="h" font-size="12">GCP</text><text x="892" y="690" class="muted" font-size="10">(APIs)</text>
    <text x="1002" y="672" class="h" font-size="12">OCI</text><text x="1002" y="690" class="muted" font-size="10">(APIs)</text>
    <text x="1112" y="672" class="h" font-size="12">IBM Cloud</text><text x="1112" y="690" class="muted" font-size="10">(APIs)</text>
  </g>
  <line class="arr2" x1="884" y1="592" x2="884" y2="606"/>

  <!-- Secrets / Parameter / S3 columna derecha -->
  <rect class="card" x="1200" y="166" width="140" height="80" rx="8"/>
  <rect x="1214" y="186" width="26" height="26" rx="5" fill="#c0392b"/>
  <text x="1250" y="196" class="h" font-size="12">Secrets Mgr</text>
  <text x="1250" y="214" class="muted" font-size="10">Credenciales</text>
  <text x="1250" y="228" class="muted" font-size="10">y secretos</text>

  <rect class="card" x="1200" y="262" width="140" height="80" rx="8"/>
  <rect x="1214" y="282" width="26" height="26" rx="5" fill="#7a3fb0"/>
  <text x="1250" y="292" class="h" font-size="12">Parameter Store</text>
  <text x="1250" y="310" class="muted" font-size="10">Configuración</text>

  <rect class="card" x="1200" y="358" width="140" height="80" rx="8"/>
  <rect x="1214" y="378" width="26" height="26" rx="5" fill="#1a7a4a"/>
  <text x="1250" y="388" class="h" font-size="12">S3 (opcional)</text>
  <text x="1250" y="406" class="muted" font-size="10">Backups /</text>
  <text x="1250" y="420" class="muted" font-size="10">exportaciones</text>
  <line class="arr2" x1="1186" y1="300" x2="1198" y2="300"/>

  <!-- SSM / CloudWatch / CloudTrail -->
  <g>
    <rect x="582" y="166" width="104" height="80" class="inner" rx="8"/>
    <text x="634" y="196" class="h" font-size="11" text-anchor="middle">Systems Mgr</text>
    <text x="634" y="214" class="muted" font-size="9" text-anchor="middle">gestión</text>
    <text x="634" y="228" class="muted" font-size="9" text-anchor="middle">y monitoreo</text>
  </g>

  <!-- ===================== panel inferior ===================== -->
  <!-- Características -->
  <rect class="card" x="24" y="760" width="366" height="258" rx="10"/>
  <circle cx="48" cy="788" r="11" fill="#1a7a4a"/><text x="44" y="792" fill="#fff" font-size="12">✓</text>
  <text x="68" y="792" class="h" font-size="14">Características de la solución</text>
  <g font-size="11" class="txt">
    <text x="40" y="822">Aplicación en contenedores dentro de EC2</text>
    <text x="40" y="846">CI/CD con GitHub Actions</text>
    <text x="40" y="870">Acceso seguro por HTTPS</text>
    <text x="40" y="894">Datos reales de Azure (7 áreas) + multicloud</text>
    <text x="40" y="918">Caché diaria por cliente en PostgreSQL</text>
    <text x="40" y="942">Refresco diario desatendido (scheduler)</text>
    <text x="40" y="966">Alertamiento en tiempo real</text>
    <text x="40" y="990">Monitoreo y logs con CloudWatch</text>
  </g>

  <!-- Seguridad -->
  <rect class="card" x="406" y="760" width="330" height="258" rx="10"/>
  <text x="430" y="792" class="h" font-size="14">🛡  Seguridad</text>
  <g font-size="11" class="txt">
    <text x="424" y="822">Acceso por HTTPS (SSL/TLS)</text>
    <text x="424" y="846">IAM Role para la EC2 (mínimo privilegio)</text>
    <text x="424" y="870">Secrets Manager para credenciales</text>
    <text x="424" y="894">Contraseñas de usuario con bcrypt</text>
    <text x="424" y="918">Security Groups (puertos necesarios)</text>
    <text x="424" y="942">CloudTrail (auditoría)</text>
    <text x="424" y="966">Cifrado en tránsito y en reposo</text>
    <text x="424" y="990">Opcional: WAF + ALB</text>
  </g>

  <!-- Costos -->
  <rect class="card" x="752" y="760" width="440" height="258" rx="10"/>
  <text x="776" y="792" class="h" font-size="14">💲  Estimación mensual (AWS)</text>
  <g font-size="11">
    <rect x="770" y="806" width="404" height="24" fill="#eef5ff"/>
    <text x="780" y="823" class="lbl">Servicio</text>
    <text x="1010" y="823" class="lbl">Config.</text>
    <text x="1120" y="823" class="lbl">USD/mes</text>
    <g class="txt">
      <text x="780" y="850">EC2 (t3.medium)</text><text x="1010" y="850">730 h</text><text x="1120" y="850">~ 30.84</text>
      <text x="780" y="872">EBS (gp3)</text><text x="1010" y="872">50 GB</text><text x="1120" y="872">~ 4.00</text>
      <text x="780" y="894">Data Transfer</text><text x="1010" y="894">~100 GB</text><text x="1120" y="894">~ 9.00</text>
      <text x="780" y="916">CloudWatch</text><text x="1010" y="916">básico</text><text x="1120" y="916">~ 5.00</text>
      <text x="780" y="938">CloudTrail</text><text x="1010" y="938">1 región</text><text x="1120" y="938">~ 2.00</text>
      <text x="780" y="960">Secrets Manager</text><text x="1010" y="960">1 secreto</text><text x="1120" y="960">~ 1.00</text>
      <text x="780" y="982">S3 (opcional)</text><text x="1010" y="982">50 GB</text><text x="1120" y="982">~ 1.15</text>
    </g>
    <rect x="770" y="992" width="404" height="20" fill="#e8f5ee"/>
    <text x="780" y="1007" class="ok" font-size="12">Total estimado</text>
    <text x="1120" y="1007" class="ok" font-size="12">~ 53.99 USD</text>
  </g>

  <!-- Notas -->
  <rect class="card" x="1208" y="760" width="308" height="258" rx="10"/>
  <text x="1232" y="792" class="h" font-size="14">ℹ  Notas importantes</text>
  <g font-size="10.5" class="txt">
    <text x="1226" y="820">• Estimación con uso moderado y 50</text>
    <text x="1238" y="836">usuarios concurrentes.</text>
    <text x="1226" y="862">• PostgreSQL y Redis corren como</text>
    <text x="1238" y="878">contenedores dentro de la EC2; la DB</text>
    <text x="1238" y="894">persiste en volumen EBS.</text>
    <text x="1226" y="920">• Refresco diario DESACTIVADO hasta</text>
    <text x="1238" y="936">tener los Service Principals por cliente.</text>
    <text x="1226" y="962">• Para alta disponibilidad: migrar a RDS</text>
    <text x="1238" y="978">+ ElastiCache y Auto Scaling.</text>
  </g>

  <!-- pie -->
  <rect x="0" y="1026" width="1540" height="14" fill="#0b2a4a"/>
  <text x="24" y="1037" fill="#cfe0f5" font-size="9">Kyndryl Orbit  ·  Multi-Cloud Automation &amp; Governance</text>
  <text x="1516" y="1037" fill="#cfe0f5" font-size="9" text-anchor="end">Arquitectura propuesta para despliegue en AWS (EC2 + Docker)  ·  v2.0</text>
</svg>
