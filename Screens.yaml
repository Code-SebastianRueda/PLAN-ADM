Screens:
  scrCrearCaso:
    Properties:
      Fill: =RGBA(244, 243, 252, 1)
      Width: =App.Width
      Height: =App.Height
    Children:
      - recHeaderCrear:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =App.Width
            Height: =90
            Fill: =RGBA(41, 11, 88, 1)

      - lblLogoCrear:
          Control: Label@2.5.1
          Properties:
            Text: ="CHUBB"
            X: =35
            Y: =18
            Width: =250
            Height: =55
            Color: =Color.White
            Size: =30
            FontWeight: =FontWeight.Bold

      - lblTituloCrear:
          Control: Label@2.5.1
          Properties:
            Text: ="＋  Creando Caso - Nuevo Alertamiento UAC"
            X: =340
            Y: =20
            Width: =600
            Height: =50
            Color: =Color.White
            Size: =22
            FontWeight: =FontWeight.Bold

      - btnVolver:
          Control: Button@0.0.45
          Properties:
            Text: ="❮ Volver"
            X: =1300
            Y: =22
            Width: =110
            Height: =45
            BasePaletteColor: =RGBA(84, 32, 168, 1)
            OnSelect: =Navigate(scrPanelAlertamientos, ScreenTransition.Fade)

      - recFormulario:
          Control: Rectangle@2.3.0
          Properties:
            X: =25
            Y: =110
            Width: =App.Width - 50
            Height: =760
            Fill: =Color.White
            BorderColor: =RGBA(225, 221, 240, 1)
            BorderThickness: =1

      - lblSubtituloForm:
          Control: Label@2.5.1
          Properties:
            Text: ="* Todos los campos son obligatorios"
            X: =50
            Y: =125
            Width: =400
            Height: =30
            Color: =RGBA(166, 91, 0, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - lblFormFecha:
          Control: Label@2.5.1
          Properties:
            Text: ="1. Agregue fecha inicial del alertamiento"
            X: =50
            Y: =170
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - dpFechaCreacion:
          Control: DatePicker@0.0.46
          Properties:
            X: =50
            Y: =200
            Width: =620
            Height: =42

      - lblFormResponsableCitada:
          Control: Label@2.5.1
          Properties:
            Text: ="2. Asigne el responsable de la citada"
            X: =50
            Y: =260
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - ddFormResponsableCitada:
          Control: Dropdown@0.0.45
          Properties:
            X: =50
            Y: =290
            Width: =620
            Height: =42
            Items: =["Seleccione...", "Persona 1", "Persona 2"]

      - lblFormSponsorArea:
          Control: Label@2.5.1
          Properties:
            Text: ="3. Sponsor / Área encargada"
            X: =50
            Y: =350
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - ddFormSponsor:
          Control: Dropdown@0.0.45
          Properties:
            X: =50
            Y: =380
            Width: =300
            Height: =42
            Items: =["Sponsor...", "Sponsor A", "Sponsor B", "Sponsor C"]

      - ddFormArea:
          Control: Dropdown@0.0.45
          Properties:
            X: =370
            Y: =380
            Width: =300
            Height: =42
            Items: =["Área...", "UAC", "Infraestructura", "Aplicaciones"]

      - lblFormAreaEncargada:
          Control: Label@2.5.1
          Properties:
            Text: ="4. Ingrese el área encargada"
            X: =50
            Y: =440
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - ddFormAreaEncargada:
          Control: Dropdown@0.0.45
          Properties:
            X: =50
            Y: =470
            Width: =620
            Height: =42
            Items: =["Seleccione área...", "UAC", "Área Técnica", "Área Operativa"]

      - lblFormResponsableEjecucion:
          Control: Label@2.5.1
          Properties:
            Text: ="5. Asigne el responsable de la ejecución"
            X: =50
            Y: =530
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - ddFormResponsableEjecucion:
          Control: Dropdown@0.0.45
          Properties:
            X: =50
            Y: =560
            Width: =620
            Height: =42
            Items: =["Seleccione responsable...", "Responsable 1", "Responsable 2"]

      - lblFormTipoAlertamiento:
          Control: Label@2.5.1
          Properties:
            Text: ="6. Tipo de alertamiento"
            X: =710
            Y: =170
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - ddFormTipoAlertamiento:
          Control: Dropdown@0.0.45
          Properties:
            X: =710
            Y: =200
            Width: =620
            Height: =42
            Items: =["Seleccione tipo...", "Operativo", "Técnico", "Comercial"]

      - lblFormMetodo:
          Control: Label@2.5.1
          Properties:
            Text: ="7. Seleccione el método"
            X: =710
            Y: =260
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - ddFormMetodo:
          Control: Dropdown@0.0.45
          Properties:
            X: =710
            Y: =290
            Width: =620
            Height: =42
            Items: =["Seleccione método...", "Método A", "Método B"]

      - lblFormSubmotivo:
          Control: Label@2.5.1
          Properties:
            Text: ="8. Seleccione el submotivo"
            X: =710
            Y: =350
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - ddFormSubmotivo:
          Control: Dropdown@0.0.45
          Properties:
            X: =710
            Y: =380
            Width: =620
            Height: =42
            Items: =["Seleccione submotivo...", "Proceso", "Sistema", "Servicio", "Cliente"]

      - lblFormProblematica:
          Control: Label@2.5.1
          Properties:
            Text: ="9. Escriba la problemática"
            X: =710
            Y: =440
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - txtFormProblematica:
          Control: Text@0.0.38
          Properties:
            Default: =""
            HintText: ="Describa brevemente la problemática..."
            X: =710
            Y: =470
            Width: =620
            Height: =42

      - lblFormSoporte:
          Control: Label@2.5.1
          Properties:
            Text: ="10. Soporte (opcional)"
            X: =710
            Y: =530
            Width: =600
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - txtFormSoporte:
          Control: Text@0.0.38
          Properties:
            Default: =""
            HintText: ="Enlace o referencia de soporte..."
            X: =710
            Y: =560
            Width: =620
            Height: =42

      - btnEnviarCaso:
          Control: Button@0.0.45
          Properties:
            Text: ="✓  Enviar Caso"
            X: =540
            Y: =680
            Width: =300
            Height: =55
            BasePaletteColor: =RGBA(8, 117, 44, 1)
            OnSelect: |-
              =If(
                IsBlank(dpFechaCreacion.SelectedDate) || IsBlank(ddFormResponsableCitada.Selected.Value),
                Notify("Por favor completa los campos obligatorios", NotificationType.Warning),
                Notify("Caso creado exitosamente", NotificationType.Success);
                Navigate(scrPanelAlertamientos, ScreenTransition.Fade)
              )
