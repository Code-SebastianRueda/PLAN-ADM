Screens:
  scrPanelAlertamientos:
    Properties:
      Fill: =RGBA(244, 243, 252, 1)
      LoadingSpinnerColor: =RGBA(84, 32, 168, 1)

    Children:

      # ==========================================
      # ENCABEZADO CORPORATIVO
      # ==========================================

      - recHeader:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =App.Width
            Height: =90
            Fill: =RGBA(41, 11, 88, 1)

      - lblLogo:
          Control: Label@2.5.1
          Properties:
            Text: ="CHUBB"
            X: =35
            Y: =18
            Width: =250
            Height: =55
            Color: =Color.White
            Size: =30
            FontWeight: =FontWeight.Bold

      - lblTitulo:
          Control: Label@2.5.1
          Properties:
            Text: ="🔔  Panel de Alertamientos"
            X: =340
            Y: =20
            Width: =450
            Height: =50
            Color: =Color.White
            Size: =24
            FontWeight: =FontWeight.Bold

      - lblNavegacion:
          Control: Label@2.5.1
          Properties:
            Text: ="⌂    Inicio    /    Proceso de alertamiento UAC"
            X: =850
            Y: =20
            Width: =470
            Height: =50
            Color: =Color.White
            Size: =14

      - lblUsuario:
          Control: Label@2.5.1
          Properties:
            Text: ="◉  Usuario"
            X: =1320
            Y: =20
            Width: =110
            Height: =50
            Color: =Color.White
            Size: =14

      # ==========================================
      # PANEL DE FILTROS
      # ==========================================

      - recFiltros:
          Control: Rectangle@2.3.0
          Properties:
            X: =25
            Y: =110
            Width: =App.Width - 50
            Height: =235
            Fill: =Color.White
            BorderColor: =RGBA(225, 221, 240, 1)
            BorderThickness: =1

      - lblFiltros:
          Control: Label@2.5.1
          Properties:
            Text: ="◆  Filtros de búsqueda"
            X: =50
            Y: =120
            Width: =350
            Height: =35
            Color: =RGBA(41, 16, 90, 1)
            Size: =20
            FontWeight: =FontWeight.Bold

      # Fecha inicial

      - lblFecha:
          Control: Label@2.5.1
          Properties:
            Text: ="Fecha inicial"
            X: =60
            Y: =160
            Width: =150
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - dpDesde:
          Control: DatePicker@0.0.46
          Properties:
            X: =60
            Y: =188
            Width: =300
            Height: =43

      # Analista

      - lblAnalista:
          Control: Label@2.5.1
          Properties:
            Text: ="Analista asignado"
            X: =410
            Y: =160
            Width: =200
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddAnalista:
          Control: Dropdown@0.0.45
          Properties:
            X: =410
            Y: =188
            Width: =290
            Height: =43
            Items: =["Todos", "Analista 1", "Analista 2"]

      # Sponsor

      - lblSponsor:
          Control: Label@2.5.1
          Properties:
            Text: ="Sponsor"
            X: =735
            Y: =160
            Width: =150
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddSponsor:
          Control: Dropdown@0.0.45
          Properties:
            X: =735
            Y: =188
            Width: =280
            Height: =43
            Items: =["Todos", "Sponsor A", "Sponsor B", "Sponsor C"]

      # Área

      - lblArea:
          Control: Label@2.5.1
          Properties:
            Text: ="Área"
            X: =1050
            Y: =160
            Width: =120
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddArea:
          Control: Dropdown@0.0.45
          Properties:
            X: =1050
            Y: =188
            Width: =250
            Height: =43
            Items: =["Todas", "UAC", "Infraestructura", "Aplicaciones"]

      # Causal

      - lblCausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Causal"
            X: =60
            Y: =245
            Width: =150
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddCausal:
          Control: Dropdown@0.0.45
          Properties:
            X: =60
            Y: =273
            Width: =300
            Height: =43
            Items: =["Todas", "Operativo", "Técnico", "Comercial"]

      # Subcausal

      - lblSubcausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Subcausal"
            X: =410
            Y: =245
            Width: =200
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddSubcausal:
          Control: Dropdown@0.0.45
          Properties:
            X: =410
            Y: =273
            Width: =290
            Height: =43
            Items: =["Todas", "Proceso", "Sistema", "Servicio", "Cliente"]

      # Responsable

      - lblResponsable:
          Control: Label@2.5.1
          Properties:
            Text: ="Responsable operativo"
            X: =735
            Y: =245
            Width: =250
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddResponsable:
          Control: Dropdown@0.0.45
          Properties:
            X: =735
            Y: =273
            Width: =280
            Height: =43
            Items: =["Todos", "Responsable 1", "Responsable 2"]

      # Estado

      - lblEstado:
          Control: Label@2.5.1
          Properties:
            Text: ="Estado"
            X: =1050
            Y: =245
            Width: =120
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddEstado:
          Control: Dropdown@0.0.45
          Properties:
            X: =1050
            Y: =273
            Width: =250
            Height: =43
            Items: =["Todos", "Pendiente", "En proceso", "Resuelto", "En espera"]

      # ==========================================
      # BOTONES DE FILTROS
      # ==========================================

      - btnBuscar:
          Control: Button@0.0.45
          Properties:
            Text: ="Buscar"
            X: =1330
            Y: =205
            Width: =130
            Height: =45
            BasePaletteColor: =RGBA(84, 32, 168, 1)
            OnSelect: =Set(varPagina, 1); Set(varAplicarFiltros, true)

      - btnLimpiar:
          Control: Button@0.0.45
          Properties:
            Text: ="Limpiar filtros"
            X: =1330
            Y: =150
            Width: =130
            Height: =45
            OnSelect: =Reset(ddAnalista); Reset(ddSponsor); Reset(ddArea); Reset(ddCausal); Reset(ddSubcausal); Reset(ddResponsable); Reset(ddEstado); Reset(dpDesde); Set(varAplicarFiltros, false); Set(varPagina, 1)

      # ==========================================
      # ACCIONES PRINCIPALES
      # ==========================================

      - recCrear:
          Control: Rectangle@2.3.0
          Properties:
            X: =25
            Y: =365
            Width: =(App.Width - 75) / 2
            Height: =105
            Fill: =RGBA(231, 248, 239, 1)
            BorderColor: =RGBA(129, 214, 166, 1)
            BorderThickness: =1

      - btnCrearCaso:
          Control: Button@0.0.45
          Properties:
            Text: ="＋  Crear Caso"
            X: =55
            Y: =385
            Width: =300
            Height: =65
            BasePaletteColor: =RGBA(8, 117, 44, 1)
            OnSelect: =Set(varModoFormulario, "Nuevo"); Set(varCasoSeleccionado, Blank()); Navigate(scrCrearCaso)

      - recSolucionar:
          Control: Rectangle@2.3.0
          Properties:
            X: =(App.Width / 2) + 12
            Y: =365
            Width: =(App.Width - 75) / 2
            Height: =105
            Fill: =RGBA(231, 240, 255, 1)
            BorderColor: =RGBA(140, 183, 245, 1)
            BorderThickness: =1

      - btnSolucionar:
          Control: Button@0.0.45
          Properties:
            Text: ="✓  Solucionar Caso"
            X: =(App.Width / 2) + 40
            Y: =385
            Width: =330
            Height: =65
            BasePaletteColor: =RGBA(7, 85, 166, 1)
            OnSelect: =If(IsBlank(varCasoSeleccionado), Notify("Selecciona primero un caso", NotificationType.Warning), Set(varModoFormulario, "Solucionar"); Navigate(scrSolucionarCaso))

      # ==========================================
      # LISTADO DE ALERTAMIENTOS
      # ==========================================

      - recTabla:
          Control: Rectangle@2.3.0
          Properties:
            X: =25
            Y: =490
            Width: =App.Width - 50
            Height: =385
            Fill: =Color.White
            BorderColor: =RGBA(225, 221, 240, 1)
            BorderThickness: =1

      - lblTituloTabla:
          Control: Label@2.5.1
          Properties:
            Text: ="☷  Casos de Alertamientos"
            X: =50
            Y: =500
            Width: =450
            Height: =40
            Color: =RGBA(41, 16, 90, 1)
            Size: =21
            FontWeight: =FontWeight.Bold

      - lblTotal:
          Control: Label@2.5.1
          Properties:
            Text: ="Total: " & CountRows(galAlertamientos.AllItems) & " registros visibles"
            X: =1180
            Y: =505
            Width: =250
            Height: =35
            Color: =RGBA(84, 32, 168, 1)
            Size: =14
            FontWeight: =FontWeight.Bold

      # ==========================================
      # ENCABEZADOS DE LA TABLA
      # ==========================================

      - recHeaderTabla:
          Control: Rectangle@2.3.0
          Properties:
            X: =45
            Y: =560
            Width: =App.Width - 90
            Height: =45
            Fill: =RGBA(41, 11, 88, 1)

      - lblColCaso:
          Control: Label@2.5.1
          Properties:
            Text: ="Caso"
            X: =55
            Y: =565
            Width: =120
            Height: =35
            Color: =Color.White
            Size: =13
            FontWeight: =FontWeight.Bold

      - lblColAsignado:
          Control: Label@2.5.1
          Properties:
            Text: ="Asignado"
            X: =190
            Y: =565
            Width: =170
            Height: =35
            Color: =Color.White
            Size: =13
            FontWeight: =FontWeight.Bold

      - lblColSponsor:
          Control: Label@2.5.1
          Properties:
            Text: ="Sponsor"
            X: =375
            Y: =565
            Width: =150
            Height: =35
            Color: =Color.White
            Size: =13
            FontWeight: =FontWeight.Bold

      - lblColArea:
          Control: Label@2.5.1
          Properties:
            Text: ="Área"
            X: =545
            Y: =565
            Width: =90
            Height: =35
            Color: =Color.White
            Size: =13
            FontWeight: =FontWeight.Bold

      - lblColCausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Causal"
            X: =655
            Y: =565
            Width: =130
            Height: =35
            Color: =Color.White
            Size: =13
            FontWeight: =FontWeight.Bold

      - lblColSubcausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Subcausal"
            X: =800
            Y: =565
            Width: =150
            Height: =35
            Color: =Color.White
            Size: =13
            FontWeight: =FontWeight.Bold

      - lblColEstado:
          Control: Label@2.5.1
          Properties:
            Text: ="Estado"
            X: =970
            Y: =565
            Width: =150
            Height: =35
            Color: =Color.White
            Size: =13
            FontWeight: =FontWeight.Bold

      - lblColFecha:
          Control: Label@2.5.1
          Properties:
            Text: ="Fecha creación"
            X: =1135
            Y: =565
            Width: =160
            Height: =35
            Color: =Color.White
            Size: =13
            FontWeight: =FontWeight.Bold

      - lblColAcciones:
          Control: Label@2.5.1
          Properties:
            Text: ="Acciones"
            X: =1320
            Y: =565
            Width: =110
            Height: =35
            Color: =Color.White
            Size: =13
            FontWeight: =FontWeight.Bold

      # ==========================================
      # GALERÍA DE CASOS
      # ==========================================

      - galAlertamientos:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =45
            Y: =605
            Width: =App.Width - 90
            Height: =220
            TemplateSize: =43
            TemplatePadding: =1
            Items: |-
              =With(
                {
                  datos: Table(
                    {Caso:"001-2026",Asignado:"Juan Pérez",Sponsor:"Sponsor A",Area:"UAC",Causal:"Operativo",Subcausal:"Proceso",Estado:"Pendiente",FechaCreacion:Date(2026,10,16)},
                    {Caso:"002-2026",Asignado:"María López",Sponsor:"Sponsor B",Area:"UAC",Causal:"Técnico",Subcausal:"Sistema",Estado:"Resuelto",FechaCreacion:Date(2026,10,15)},
                    {Caso:"003-2026",Asignado:"Carlos Rodríguez",Sponsor:"Sponsor A",Area:"UAC",Causal:"Operativo",Subcausal:"Servicio",Estado:"En proceso",FechaCreacion:Date(2026,10,14)},
                    {Caso:"004-2026",Asignado:"Ana Martínez",Sponsor:"Sponsor C",Area:"UAC",Causal:"Comercial",Subcausal:"Cliente",Estado:"En espera",FechaCreacion:Date(2026,10,13)},
                    {Caso:"005-2026",Asignado:"Diego Castro",Sponsor:"Sponsor A",Area:"UAC",Causal:"Técnico",Subcausal:"Infraestructura",Estado:"Resuelto",FechaCreacion:Date(2026,10,12)}
                  )
                },
                Filter(
                  datos,
                  ddAnalista.Selected.Value = "Todos" || Asignado = ddAnalista.Selected.Value,
                  ddSponsor.Selected.Value = "Todos" || Sponsor = ddSponsor.Selected.Value,
                  ddArea.Selected.Value = "Todas" || Area = ddArea.Selected.Value,
                  ddCausal.Selected.Value = "Todas" || Causal = ddCausal.Selected.Value,
                  ddSubcausal.Selected.Value = "Todas" || Subcausal = ddSubcausal.Selected.Value,
                  ddEstado.Selected.Value = "Todos" || Estado = ddEstado.Selected.Value
                )
              )

          Children:

            - lblCaso:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Caso
                  X: =10
                  Y: =4
                  Width: =125
                  Height: =35
                  Size: =12

            - lblAsignado:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Asignado
                  X: =145
                  Y: =4
                  Width: =170
                  Height: =35
                  Size: =12

            - lblSponsorFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Sponsor
                  X: =330
                  Y: =4
                  Width: =150
                  Height: =35
                  Size: =12

            - lblAreaFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Area
                  X: =500
                  Y: =4
                  Width: =90
                  Height: =35
                  Size: =12

            - lblCausalFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Causal
                  X: =610
                  Y: =4
                  Width: =130
                  Height: =35
                  Size: =12

            - lblSubcausalFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Subcausal
                  X: =755
                  Y: =4
                  Width: =150
                  Height: =35
                  Size: =12

            - lblEstadoFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Estado
                  X: =925
                  Y: =4
                  Width: =150
                  Height: =35
                  Size: =12
                  FontWeight: =FontWeight.Bold
                  Color: |-
                    =Switch(
                      ThisItem.Estado,
                      "Pendiente", RGBA(166,91,0,1),
                      "Resuelto", RGBA(8,117,44,1),
                      "En proceso", RGBA(7,85,166,1),
                      "En espera", RGBA(85,85,85,1),
                      Color.Black
                    )

            - lblFechaFila:
                Control: Label@2.5.1
                Properties:
                  Text: =Text(ThisItem.FechaCreacion,"dd/mm/yyyy")
                  X: =1090
                  Y: =4
                  Width: =160
                  Height: =35
                  Size: =12

            - btnVer:
                Control: Button@0.0.45
                Properties:
                  Text: ="◉"
                  X: =1275
                  Y: =4
                  Width: =40
                  Height: =32
                  OnSelect: =Set(varCasoSeleccionado,ThisItem); Notify("Caso seleccionado: " & ThisItem.Caso,NotificationType.Information)

            - btnEditar:
                Control: Button@0.0.45
                Properties:
                  Text: ="✎"
                  X: =1320
                  Y: =4
                  Width: =40
                  Height: =32
                  OnSelect: =Set(varCasoSeleccionado,ThisItem); Set(varModoFormulario,"Editar"); Notify("Caso seleccionado para edición",NotificationType.Information)

      # ==========================================
      # PAGINACIÓN
      # ==========================================

      - btnAnterior:
          Control: Button@0.0.45
          Properties:
            Text: ="❮"
            X: =50
            Y: =830
            Width: =45
            Height: =35
            OnSelect: =Set(varPagina,Max(1,varPagina-1))

      - lblPagina:
          Control: Label@2.5.1
          Properties:
            Text: ="Página " & varPagina
            X: =105
            Y: =830
            Width: =110
            Height: =35
            Color: =RGBA(84,32,168,1)
            Size: =13
            FontWeight: =FontWeight.Bold

      - btnSiguiente:
          Control: Button@0.0.45
          Properties:
            Text: ="❯"
            X: =220
            Y: =830
            Width: =45
            Height: =35
            OnSelect: =Set(varPagina,varPagina+1)

      - lblRegistros:
          Control: Label@2.5.1
          Properties:
            Text: ="Mostrando registros de alertamiento"
            X: =1100
            Y: =830
            Width: =330
            Height: =35
            Color: =RGBA(41,16,90,1)
            Size: =12