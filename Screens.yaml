Screens:
  scrPanelAlertamientos:
    Properties:
      Fill: =RGBA(244, 243, 252, 1)
      Width: =App.Width
      Height: =App.Height
    Children:
      - recHeader:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =App.Width
            Height: =90
            Fill: =RGBA(41, 11, 88, 1)

      - lblLogo:
          Control: Label@2.5.1
          Properties:
            Text: ="CHUBB"
            X: =35
            Y: =18
            Width: =250
            Height: =55
            Color: =Color.White
            Size: =30
            FontWeight: =FontWeight.Bold

      - lblTitulo:
          Control: Label@2.5.1
          Properties:
            Text: ="🔔  Panel de Alertamientos"
            X: =340
            Y: =20
            Width: =480
            Height: =50
            Color: =Color.White
            Size: =24
            FontWeight: =FontWeight.Bold

      - lblNavegacion:
          Control: Label@2.5.1
          Properties:
            Text: ="⌂   Inicio   /   Proceso de alertamiento UAC"
            X: =850
            Y: =20
            Width: =450
            Height: =50
            Color: =Color.White
            Size: =14

      - recFiltros:
          Control: Rectangle@2.3.0
          Properties:
            X: =25
            Y: =110
            Width: =App.Width - 50
            Height: =235
            Fill: =Color.White
            BorderColor: =RGBA(225, 221, 240, 1)
            BorderThickness: =1

      - lblFiltros:
          Control: Label@2.5.1
          Properties:
            Text: ="◆  Filtros de búsqueda"
            X: =50
            Y: =120
            Width: =350
            Height: =35
            Color: =RGBA(41, 16, 90, 1)
            Size: =20
            FontWeight: =FontWeight.Bold

      - lblFecha:
          Control: Label@2.5.1
          Properties:
            Text: ="Fecha inicial"
            X: =60
            Y: =160
            Width: =150
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - dpDesde:
          Control: DatePicker@0.0.46
          Properties:
            X: =60
            Y: =188
            Width: =280
            Height: =42

      - lblMesFinal:
          Control: Label@2.5.1
          Properties:
            Text: ="Mes fecha final"
            X: =360
            Y: =160
            Width: =150
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddMesFinal:
          Control: Dropdown@0.0.45
          Properties:
            X: =360
            Y: =188
            Width: =260
            Height: =42
            Items: =["Todos", "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"]

      - lblAnalista:
          Control: Label@2.5.1
          Properties:
            Text: ="Analista Encargado UAC"
            X: =640
            Y: =160
            Width: =200
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddAnalistaEncargadoUAC:
          Control: Dropdown@0.0.45
          Properties:
            X: =640
            Y: =188
            Width: =260
            Height: =42
            Items: =["Todos"] & Distinct(Tabla1, ANALISTAENCARGADOUAC)

      - lblSponsor:
          Control: Label@2.5.1
          Properties:
            Text: ="Sponsor"
            X: =920
            Y: =160
            Width: =150
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddSponsor:
          Control: Dropdown@0.0.45
          Properties:
            X: =920
            Y: =188
            Width: =240
            Height: =42
            Items: =["Todos"] & Distinct(Tabla1, SPONSOR)

      - lblArea:
          Control: Label@2.5.1
          Properties:
            Text: ="Área"
            X: =1180
            Y: =160
            Width: =120
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddArea:
          Control: Dropdown@0.0.45
          Properties:
            X: =1180
            Y: =188
            Width: =230
            Height: =42
            Items: =["Todas"] & Distinct(Tabla1, AREA)

      - lblCausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Causal"
            X: =60
            Y: =245
            Width: =150
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddCausal:
          Control: Dropdown@0.0.45
          Properties:
            X: =60
            Y: =273
            Width: =280
            Height: =42
            Items: =["Todas"] & Distinct(Tabla1, CAUSAL)

      - lblSubcausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Subcausal"
            X: =360
            Y: =245
            Width: =150
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddSubcausal:
          Control: Dropdown@0.0.45
          Properties:
            X: =360
            Y: =273
            Width: =260
            Height: =42
            Items: =["Todas"] & Distinct(Tabla1, SUBCAUSAL)

      - lblResponsable:
          Control: Label@2.5.1
          Properties:
            Text: ="Responsable operativo"
            X: =640
            Y: =245
            Width: =200
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddResponsable:
          Control: Dropdown@0.0.45
          Properties:
            X: =640
            Y: =273
            Width: =260
            Height: =42
            Items: =["Todos"] & Distinct(Tabla1, RESPONSABLEOPERATIVO)

      - lblEstado:
          Control: Label@2.5.1
          Properties:
            Text: ="Estado"
            X: =920
            Y: =245
            Width: =150
            Height: =25
            Color: =RGBA(41, 16, 90, 1)
            Size: =14

      - ddEstado:
          Control: Dropdown@0.0.45
          Properties:
            X: =920
            Y: =273
            Width: =240
            Height: =42
            Items: =["Todos"] & Distinct(Tabla1, ESTADO)

      - btnBuscar:
          Control: Button@0.0.45
          Properties:
            Text: ="Buscar"
            X: =1180
            Y: =273
            Width: =110
            Height: =42
            BasePaletteColor: =RGBA(84, 32, 168, 1)
            OnSelect: =Set(varBuscar, true)

      - btnLimpiar:
          Control: Button@0.0.45
          Properties:
            Text: ="Limpiar"
            X: =1300
            Y: =273
            Width: =110
            Height: =42
            OnSelect: =Reset(dpDesde); Reset(ddMesFinal); Reset(ddAnalistaEncargadoUAC); Reset(ddSponsor); Reset(ddArea); Reset(ddCausal); Reset(ddSubcausal); Reset(ddResponsable); Reset(ddEstado); Set(varBuscar, false)

      - recCrear:
          Control: Rectangle@2.3.0
          Properties:
            X: =25
            Y: =365
            Width: =(App.Width - 75) / 2
            Height: =95
            Fill: =RGBA(231, 248, 239, 1)
            BorderColor: =RGBA(129, 214, 166, 1)
            BorderThickness: =1

      - btnCrearCaso:
          Control: Button@0.0.45
          Properties:
            Text: ="＋  Crear Caso"
            X: =50
            Y: =380
            Width: =320
            Height: =65
            BasePaletteColor: =RGBA(8, 117, 44, 1)
            OnSelect: =Set(varModoFormulario, "Nuevo"); Set(varCasoSeleccionado, Blank()); Navigate(scrCrearCaso, ScreenTransition.Fade)

      - recSolucionar:
          Control: Rectangle@2.3.0
          Properties:
            X: =(App.Width / 2) + 12
            Y: =365
            Width: =(App.Width - 75) / 2
            Height: =95
            Fill: =RGBA(231, 240, 255, 1)
            BorderColor: =RGBA(140, 183, 245, 1)
            BorderThickness: =1

      - btnSolucionar:
          Control: Button@0.0.45
          Properties:
            Text: ="✓  Solucionar Caso"
            X: =(App.Width / 2) + 35
            Y: =380
            Width: =330
            Height: =65
            BasePaletteColor: =RGBA(7, 85, 166, 1)
            OnSelect: =If(IsBlank(varCasoSeleccionado), Notify("Selecciona primero un caso", NotificationType.Warning), Set(varModoFormulario, "Solucionar"))

      - recTabla:
          Control: Rectangle@2.3.0
          Properties:
            X: =25
            Y: =480
            Width: =App.Width - 50
            Height: =390
            Fill: =Color.White
            BorderColor: =RGBA(225, 221, 240, 1)
            BorderThickness: =1

      - lblTituloTabla:
          Control: Label@2.5.1
          Properties:
            Text: ="☷  Casos de Alertamientos"
            X: =50
            Y: =495
            Width: =450
            Height: =35
            Color: =RGBA(41, 16, 90, 1)
            Size: =20
            FontWeight: =FontWeight.Bold

      - lblTotal:
          Control: Label@2.5.1
          Properties:
            Text: '="Total de registros: " & CountRows(galAlertamientos.AllItems)'
            X: =1150
            Y: =498
            Width: =260
            Height: =35
            Color: =RGBA(84, 32, 168, 1)
            Size: =14
            FontWeight: =FontWeight.Bold

      - recHeaderTabla:
          Control: Rectangle@2.3.0
          Properties:
            X: =45
            Y: =545
            Width: =App.Width - 90
            Height: =40
            Fill: =RGBA(41, 11, 88, 1)

      - lblColCaso:
          Control: Label@2.5.1
          Properties:
            Text: ="Fecha"
            X: =55
            Y: =550
            Width: =130
            Height: =30
            Color: =Color.White
            Size: =12
            FontWeight: =FontWeight.Bold

      - lblColAnalista:
          Control: Label@2.5.1
          Properties:
            Text: ="Analista"
            X: =190
            Y: =550
            Width: =180
            Height: =30
            Color: =Color.White
            Size: =12
            FontWeight: =FontWeight.Bold

      - lblColSponsor:
          Control: Label@2.5.1
          Properties:
            Text: ="Sponsor"
            X: =375
            Y: =550
            Width: =150
            Height: =30
            Color: =Color.White
            Size: =12
            FontWeight: =FontWeight.Bold

      - lblColArea:
          Control: Label@2.5.1
          Properties:
            Text: ="Área"
            X: =535
            Y: =550
            Width: =100
            Height: =30
            Color: =Color.White
            Size: =12
            FontWeight: =FontWeight.Bold

      - lblColCausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Causal"
            X: =640
            Y: =550
            Width: =130
            Height: =30
            Color: =Color.White
            Size: =12
            FontWeight: =FontWeight.Bold

      - lblColSubcausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Subcausal"
            X: =780
            Y: =550
            Width: =150
            Height: =30
            Color: =Color.White
            Size: =12
            FontWeight: =FontWeight.Bold

      - lblColResponsable:
          Control: Label@2.5.1
          Properties:
            Text: ="Responsable"
            X: =940
            Y: =550
            Width: =160
            Height: =30
            Color: =Color.White
            Size: =12
            FontWeight: =FontWeight.Bold

      - lblColEstado:
          Control: Label@2.5.1
          Properties:
            Text: ="Estado"
            X: =1110
            Y: =550
            Width: =130
            Height: =30
            Color: =Color.White
            Size: =12
            FontWeight: =FontWeight.Bold

      - lblColAcciones:
          Control: Label@2.5.1
          Properties:
            Text: ="Acciones"
            X: =1250
            Y: =550
            Width: =140
            Height: =30
            Color: =Color.White
            Size: =12
            FontWeight: =FontWeight.Bold

      - galAlertamientos:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =45
            Y: =590
            Width: =App.Width - 90
            Height: =245
            TemplateSize: =45
            TemplatePadding: =1
            Items: |-
              =If(
                  !varBuscar,
                  Tabla1,
                  Filter(
                      Tabla1,
                      (ddAnalistaEncargadoUAC.Selected.Value = "Todos" || IsBlank(ddAnalistaEncargadoUAC.Selected.Value) || Upper(Trim(Text(ANALISTAENCARGADOUAC))) = Upper(Trim(ddAnalistaEncargadoUAC.Selected.Value))) &&
                      (ddSponsor.Selected.Value = "Todos" || IsBlank(ddSponsor.Selected.Value) || Upper(Trim(Text(SPONSOR))) = Upper(Trim(ddSponsor.Selected.Value))) &&
                      (ddArea.Selected.Value = "Todas" || IsBlank(ddArea.Selected.Value) || Upper(Trim(Text(AREA))) = Upper(Trim(ddArea.Selected.Value))) &&
                      (ddCausal.Selected.Value = "Todas" || IsBlank(ddCausal.Selected.Value) || Upper(Trim(Text(CAUSAL))) = Upper(Trim(ddCausal.Selected.Value))) &&
                      (ddSubcausal.Selected.Value = "Todas" || IsBlank(ddSubcausal.Selected.Value) || Upper(Trim(Text(SUBCAUSAL))) = Upper(Trim(ddSubcausal.Selected.Value))) &&
                      (ddResponsable.Selected.Value = "Todos" || IsBlank(ddResponsable.Selected.Value) || Upper(Trim(Text(RESPONSABLEOPERATIVO))) = Upper(Trim(ddResponsable.Selected.Value))) &&
                      (ddEstado.Selected.Value = "Todos" || IsBlank(ddEstado.Selected.Value) || Upper(Trim(Text(ESTADO))) = Upper(Trim(ddEstado.Selected.Value))) &&
                      (ddMesFinal.Selected.Value = "Todos" || IsBlank(ddMesFinal.Selected.Value) || Upper(Trim(Text(MESFINAL))) = Upper(Trim(ddMesFinal.Selected.Value)))
                  )
              )
          Children:
            - lblFechaFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.DIA & " / " & Proper(ThisItem.MES) & " / " & ThisItem.AÑO
                  X: =10
                  Y: =5
                  Width: =130
                  Height: =35
                  Size: =11
            - lblAnalistaFila:
                Control: Label@2.5.1
                Properties:
                  Text: =Proper(ThisItem.ANALISTAENCARGADOUAC)
                  X: =145
                  Y: =5
                  Width: =180
                  Height: =35
                  Size: =11
            - lblSponsorFila:
                Control: Label@2.5.1
                Properties:
                  Text: =Proper(ThisItem.SPONSOR)
                  X: =330
                  Y: =5
                  Width: =150
                  Height: =35
                  Size: =11
            - lblAreaFila:
                Control: Label@2.5.1
                Properties:
                  Text: =Proper(ThisItem.AREA)
                  X: =490
                  Y: =5
                  Width: =100
                  Height: =35
                  Size: =11
            - lblCausalFila:
                Control: Label@2.5.1
                Properties:
                  Text: =Proper(ThisItem.CAUSAL)
                  X: =595
                  Y: =5
                  Width: =130
                  Height: =35
                  Size: =11
            - lblSubcausalFila:
                Control: Label@2.5.1
                Properties:
                  Text: =Proper(ThisItem.SUBCAUSAL)
                  X: =735
                  Y: =5
                  Width: =150
                  Height: =35
                  Size: =11
            - lblResponsableFila:
                Control: Label@2.5.1
                Properties:
                  Text: =Proper(ThisItem.RESPONSABLEOPERATIVO)
                  X: =895
                  Y: =5
                  Width: =160
                  Height: =35
                  Size: =11
            - lblEstadoFila:
                Control: Label@2.5.1
                Properties:
                  Text: =Proper(ThisItem.ESTADO)
                  X: =1065
                  Y: =5
                  Width: =130
                  Height: =35
                  Size: =11
                  FontWeight: =FontWeight.Bold
                  Color: =Switch(ThisItem.ESTADO, "Pendiente", RGBA(166,91,0,1), "Resuelto", RGBA(8,117,44,1), "En proceso", RGBA(7,85,166,1), RGBA(85,85,85,1))
            - btnVer:
                Control: Button@0.0.45
                Properties:
                  Text: ="Ver"
                  X: =1205
                  Y: =5
                  Width: =60
                  Height: =32
                  OnSelect: =Set(varCasoSeleccionado, ThisItem)
