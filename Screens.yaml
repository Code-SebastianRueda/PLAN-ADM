
Screens:
  scrPanelAlertamientos:
    Properties:
      Fill: =RGBA(244,243,252,1)
      Width: =App.Width
      Height: =App.Height
    Children:

      # ENCABEZADO

      - recHeader:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height*0.10
            Fill: =RGBA(41,11,88,1)

      - lblLogo:
          Control: Label@2.5.1
          Properties:
            Text: ="CHUBB"
            X: =Parent.Width*0.025
            Y: =Parent.Height*0.02
            Width: =Parent.Width*0.18
            Height: =Parent.Height*0.06
            Color: =Color.White
            Size: =30
            FontWeight: =FontWeight.Bold

      - lblTitulo:
          Control: Label@2.5.1
          Properties:
            Text: ="Panel de Alertamientos"
            X: =Parent.Width*0.25
            Y: =Parent.Height*0.02
            Width: =Parent.Width*0.35
            Height: =Parent.Height*0.06
            Color: =Color.White
            Size: =24
            FontWeight: =FontWeight.Bold

      - lblNavegacion:
          Control: Label@2.5.1
          Properties:
            Text: ="Inicio / Proceso de alertamiento UAC"
            X: =Parent.Width*0.68
            Y: =Parent.Height*0.025
            Width: =Parent.Width*0.29
            Height: =Parent.Height*0.05
            Color: =Color.White
            Size: =14

      # PANEL DE FILTROS

      - recFiltros:
          Control: Rectangle@2.3.0
          Properties:
            X: =Parent.Width*0.02
            Y: =Parent.Height*0.13
            Width: =Parent.Width*0.96
            Height: =Parent.Height*0.32
            Fill: =Color.White
            BorderColor: =RGBA(225,221,240,1)
            BorderThickness: =1

      - lblFiltros:
          Control: Label@2.5.1
          Properties:
            Text: ="Filtros de búsqueda"
            X: =Parent.Width*0.04
            Y: =Parent.Height*0.14
            Width: =300
            Height: =35
            Color: =RGBA(41,16,90,1)
            Size: =20
            FontWeight: =FontWeight.Bold

      # FECHA INICIAL

      - lblFecha:
          Control: Label@2.5.1
          Properties:
            Text: ="Fecha inicial"
            X: =Parent.Width*0.04
            Y: =Parent.Height*0.19
            Width: =180
            Height: =25

      - dpDesde:
          Control: DatePicker@0.0.46
          Properties:
            X: =Parent.Width*0.04
            Y: =Parent.Height*0.22
            Width: =Parent.Width*0.16
            Height: =42

      # MES FECHA FINAL

      - lblMesFinal:
          Control: Label@2.5.1
          Properties:
            Text: ="Mes fecha final"
            X: =Parent.Width*0.23
            Y: =Parent.Height*0.19
            Width: =180
            Height: =25

      - ddMesFinal:
          Control: Dropdown@0.0.45
          Properties:
            X: =Parent.Width*0.23
            Y: =Parent.Height*0.22
            Width: =Parent.Width*0.16
            Height: =42
            Items: =["Todos","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]

      # ANALISTA

      - lblAnalista:
          Control: Label@2.5.1
          Properties:
            Text: ="Analista asignado"
            X: =Parent.Width*0.42
            Y: =Parent.Height*0.19
            Width: =180
            Height: =25

      - ddAnalista:
          Control: Dropdown@0.0.45
          Properties:
            X: =Parent.Width*0.42
            Y: =Parent.Height*0.22
            Width: =Parent.Width*0.16
            Height: =42
            Items: =["Todos"] & Distinct(Table1,AnalistaAsignado)

      # SPONSOR

      - lblSponsor:
          Control: Label@2.5.1
          Properties:
            Text: ="Sponsor"
            X: =Parent.Width*0.61
            Y: =Parent.Height*0.19
            Width: =150
            Height: =25

      - ddSponsor:
          Control: Dropdown@0.0.45
          Properties:
            X: =Parent.Width*0.61
            Y: =Parent.Height*0.22
            Width: =Parent.Width*0.16
            Height: =42
            Items: =["Todos"] & Distinct(Table1,Sponsor)

      # AREA

      - lblArea:
          Control: Label@2.5.1
          Properties:
            Text: ="Área"
            X: =Parent.Width*0.80
            Y: =Parent.Height*0.19
            Width: =150
            Height: =25

      - ddArea:
          Control: Dropdown@0.0.45
          Properties:
            X: =Parent.Width*0.80
            Y: =Parent.Height*0.22
            Width: =Parent.Width*0.16
            Height: =42
            Items: =["Todas"] & Distinct(Table1,Area)

      # CAUSAL

      - lblCausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Causal"
            X: =Parent.Width*0.04
            Y: =Parent.Height*0.29
            Width: =150
            Height: =25

      - ddCausal:
          Control: Dropdown@0.0.45
          Properties:
            X: =Parent.Width*0.04
            Y: =Parent.Height*0.32
            Width: =Parent.Width*0.16
            Height: =42
            Items: =["Todas"] & Distinct(Table1,Causal)

      # SUBCAUSAL

      - lblSubcausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Subcausal"
            X: =Parent.Width*0.23
            Y: =Parent.Height*0.29
            Width: =180
            Height: =25

      - ddSubcausal:
          Control: Dropdown@0.0.45
          Properties:
            X: =Parent.Width*0.23
            Y: =Parent.Height*0.32
            Width: =Parent.Width*0.16
            Height: =42
            Items: =["Todas"] & Distinct(Table1,Subcausal)

      # RESPONSABLE

      - lblResponsable:
          Control: Label@2.5.1
          Properties:
            Text: ="Responsable operativo"
            X: =Parent.Width*0.42
            Y: =Parent.Height*0.29
            Width: =180
            Height: =25

      - ddResponsable:
          Control: Dropdown@0.0.45
          Properties:
            X: =Parent.Width*0.42
            Y: =Parent.Height*0.32
            Width: =Parent.Width*0.16
            Height: =42
            Items: =["Todos"] & Distinct(Table1,ResponsableOperativo)

      # ESTADO

      - lblEstadoFiltro:
          Control: Label@2.5.1
          Properties:
            Text: ="Estado"
            X: =Parent.Width*0.61
            Y: =Parent.Height*0.29
            Width: =150
            Height: =25

      - ddEstado:
          Control: Dropdown@0.0.45
          Properties:
            X: =Parent.Width*0.61
            Y: =Parent.Height*0.32
            Width: =Parent.Width*0.16
            Height: =42
            Items: =["Todos"] & Distinct(Table1,Estado)

      # BOTONES

      - btnBuscar:
          Control: Button@0.0.45
          Properties:
            Text: ="Buscar"
            X: =Parent.Width*0.80
            Y: =Parent.Height*0.31
            Width: =Parent.Width*0.075
            Height: =42
            BasePaletteColor: =RGBA(84,32,168,1)
            OnSelect: =Set(varAplicarFiltros,true); Set(varPagina,1)

      - btnLimpiar:
          Control: Button@0.0.45
          Properties:
            Text: ="Limpiar"
            X: =Parent.Width*0.885
            Y: =Parent.Height*0.31
            Width: =Parent.Width*0.075
            Height: =42
            OnSelect: =Reset(dpDesde); Reset(ddMesFinal); Reset(ddAnalista); Reset(ddSponsor); Reset(ddArea); Reset(ddCausal); Reset(ddSubcausal); Reset(ddResponsable); Reset(ddEstado); Set(varAplicarFiltros,false); Set(varPagina,1)

      # ACCIONES

      - recCrear:
          Control: Rectangle@2.3.0
          Properties:
            X: =Parent.Width*0.02
            Y: =Parent.Height*0.48
            Width: =Parent.Width*0.47
            Height: =Parent.Height*0.09
            Fill: =RGBA(231,248,239,1)
            BorderColor: =RGBA(129,214,166,1)

      - btnCrearCaso:
          Control: Button@0.0.45
          Properties:
            Text: ="＋ Crear Caso"
            X: =Parent.Width*0.03
            Y: =Parent.Height*0.495
            Width: =Parent.Width*0.20
            Height: =Parent.Height*0.06
            BasePaletteColor: =RGBA(8,117,44,1)
            OnSelect: =Set(varModoFormulario,"Nuevo"); Set(varCasoSeleccionado,Blank()); Notify("Nuevo caso",NotificationType.Information)

      - recSolucionar:
          Control: Rectangle@2.3.0
          Properties:
            X: =Parent.Width*0.51
            Y: =Parent.Height*0.48
            Width: =Parent.Width*0.47
            Height: =Parent.Height*0.09
            Fill: =RGBA(231,240,255,1)
            BorderColor: =RGBA(140,183,245,1)

      - btnSolucionar:
          Control: Button@0.0.45
          Properties:
            Text: ="✓ Solucionar Caso"
            X: =Parent.Width*0.53
            Y: =Parent.Height*0.495
            Width: =Parent.Width*0.20
            Height: =Parent.Height*0.06
            BasePaletteColor: =RGBA(7,85,166,1)
            OnSelect: =If(IsBlank(varCasoSeleccionado),Notify("Selecciona un caso",NotificationType.Warning),Set(varModoFormulario,"Solucionar"))

      # TABLA

      - recTabla:
          Control: Rectangle@2.3.0
          Properties:
            X: =Parent.Width*0.02
            Y: =Parent.Height*0.60
            Width: =Parent.Width*0.96
            Height: =Parent.Height*0.37
            Fill: =Color.White
            BorderColor: =RGBA(225,221,240,1)

      - lblTituloTabla:
          Control: Label@2.5.1
          Properties:
            Text: ="Casos de Alertamientos"
            X: =Parent.Width*0.04
            Y: =Parent.Height*0.61
            Width: =400
            Height: =40
            Size: =20
            Color: =RGBA(41,16,90,1)
            FontWeight: =FontWeight.Bold

      - lblTotal:
          Control: Label@2.5.1
          Properties:
            Text: '="Total de registros: " & CountRows(galAlertamientos.AllItems)'
            X: =Parent.Width*0.78
            Y: =Parent.Height*0.615
            Width: =Parent.Width*0.18
            Height: =35
            Color: =RGBA(84,32,168,1)
            Size: =14

      # ENCABEZADOS TABLA

      - recHeaderTabla:
          Control: Rectangle@2.3.0
          Properties:
            X: =Parent.Width*0.035
            Y: =Parent.Height*0.67
            Width: =Parent.Width*0.93
            Height: =Parent.Height*0.05
            Fill: =RGBA(41,11,88,1)

      - lblColCaso:
          Control: Label@2.5.1
          Properties:
            Text: ="Día / Mes / Año"
            X: =Parent.Width*0.04
            Y: =Parent.Height*0.675
            Width: =Parent.Width*0.12
            Height: =30
            Color: =Color.White
            Size: =12

      - lblColAnalista:
          Control: Label@2.5.1
          Properties:
            Text: ="Analista"
            X: =Parent.Width*0.17
            Y: =Parent.Height*0.675
            Width: =Parent.Width*0.12
            Height: =30
            Color: =Color.White
            Size: =12

      - lblColSponsor:
          Control: Label@2.5.1
          Properties:
            Text: ="Sponsor"
            X: =Parent.Width*0.30
            Y: =Parent.Height*0.675
            Width: =Parent.Width*0.10
            Height: =30
            Color: =Color.White
            Size: =12

      - lblColArea:
          Control: Label@2.5.1
          Properties:
            Text: ="Área"
            X: =Parent.Width*0.41
            Y: =Parent.Height*0.675
            Width: =Parent.Width*0.08
            Height: =30
            Color: =Color.White
            Size: =12

      - lblColCausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Causal"
            X: =Parent.Width*0.50
            Y: =Parent.Height*0.675
            Width: =Parent.Width*0.09
            Height: =30
            Color: =Color.White
            Size: =12

      - lblColSubcausal:
          Control: Label@2.5.1
          Properties:
            Text: ="Subcausal"
            X: =Parent.Width*0.60
            Y: =Parent.Height*0.675
            Width: =Parent.Width*0.10
            Height: =30
            Color: =Color.White
            Size: =12

      - lblColResponsable:
          Control: Label@2.5.1
          Properties:
            Text: ="Responsable"
            X: =Parent.Width*0.71
            Y: =Parent.Height*0.675
            Width: =Parent.Width*0.11
            Height: =30
            Color: =Color.White
            Size: =12

      - lblColEstado:
          Control: Label@2.5.1
          Properties:
            Text: ="Estado"
            X: =Parent.Width*0.83
            Y: =Parent.Height*0.675
            Width: =Parent.Width*0.08
            Height: =30
            Color: =Color.White
            Size: =12

      # GALERÍA CON DATOS REALES

      - galAlertamientos:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =Parent.Width*0.035
            Y: =Parent.Height*0.72
            Width: =Parent.Width*0.93
            Height: =Parent.Height*0.22
            TemplateSize: =45
            TemplatePadding: =1
            Items: |-
              =With(
                {
                  datos: AddColumns(
                    Table1 As fila,
                    FechaConstruida,
                    IfError(
                      Date(
                        Value(fila.Año),
                        Switch(
                          Lower(Trim(fila.Mes)),
                          "enero",1,
                          "febrero",2,
                          "marzo",3,
                          "abril",4,
                          "mayo",5,
                          "junio",6,
                          "julio",7,
                          "agosto",8,
                          "septiembre",9,
                          "setiembre",9,
                          "octubre",10,
                          "noviembre",11,
                          "diciembre",12,
                          1
                        ),
                        Value(fila.Dia)
                      ),
                      Blank()
                    )
                  )
                },
                Filter(
                  datos,
                  !varAplicarFiltros ||
                  IsBlank(ddAnalista.Selected.Value) ||
                  ddAnalista.Selected.Value="Todos" ||
                  AnalistaAsignado=ddAnalista.Selected.Value,
                  !varAplicarFiltros ||
                  ddSponsor.Selected.Value="Todos" ||
                  Sponsor=ddSponsor.Selected.Value,
                  !varAplicarFiltros ||
                  ddArea.Selected.Value="Todas" ||
                  Area=ddArea.Selected.Value,
                  !varAplicarFiltros ||
                  ddCausal.Selected.Value="Todas" ||
                  Causal=ddCausal.Selected.Value,
                  !varAplicarFiltros ||
                  ddSubcausal.Selected.Value="Todas" ||
                  Subcausal=ddSubcausal.Selected.Value,
                  !varAplicarFiltros ||
                  ddResponsable.Selected.Value="Todos" ||
                  ResponsableOperativo=ddResponsable.Selected.Value,
                  !varAplicarFiltros ||
                  ddEstado.Selected.Value="Todos" ||
                  Estado=ddEstado.Selected.Value,
                  !varAplicarFiltros ||
                  ddMesFinal.Selected.Value="Todos" ||
                  MesFinal=ddMesFinal.Selected.Value,
                  !varAplicarFiltros ||
                  IsBlank(dpDesde.SelectedDate) ||
                  FechaConstruida>=dpDesde.SelectedDate
                )
              )

          Children:

            - lblFechaFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Dia & "/" & ThisItem.Mes & "/" & ThisItem.Año
                  X: =10
                  Y: =5
                  Width: =Parent.Width*0.13
                  Height: =35
                  Size: =11

            - lblAnalistaFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.AnalistaAsignado
                  X: =Parent.Width*0.145
                  Y: =5
                  Width: =Parent.Width*0.12
                  Height: =35
                  Size: =11

            - lblSponsorFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Sponsor
                  X: =Parent.Width*0.285
                  Y: =5
                  Width: =Parent.Width*0.10
                  Height: =35
                  Size: =11

            - lblAreaFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Area
                  X: =Parent.Width*0.405
                  Y: =5
                  Width: =Parent.Width*0.08
                  Height: =35
                  Size: =11

            - lblCausalFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Causal
                  X: =Parent.Width*0.50
                  Y: =5
                  Width: =Parent.Width*0.09
                  Height: =35
                  Size: =11

            - lblSubcausalFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Subcausal
                  X: =Parent.Width*0.60
                  Y: =5
                  Width: =Parent.Width*0.10
                  Height: =35
                  Size: =11

            - lblResponsableFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.ResponsableOperativo
                  X: =Parent.Width*0.71
                  Y: =5
                  Width: =Parent.Width*0.11
                  Height: =35
                  Size: =11

            - lblEstadoFila:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Estado
                  X: =Parent.Width*0.83
                  Y: =5
                  Width: =Parent.Width*0.09
                  Height: =35
                  Size: =11
                  FontWeight: =FontWeight.Bold
                  Color: =Switch(ThisItem.Estado,"Pendiente",RGBA(166,91,0,1),"Resuelto",RGBA(8,117,44,1),"En proceso",RGBA(7,85,166,1),RGBA(85,85,85,1))

            - btnVer:
                Control: Button@0.0.45
                Properties:
                  Text: ="Ver"
                  X: =Parent.Width*0.93
                  Y: =5
                  Width: =45
                  Height: =32
                  OnSelect: =Set(varCasoSeleccionado,ThisItem)

      # PIE DE PANTALLA

      - lblPagina:
          Control: Label@2.5.1
          Properties:
            Text: ="Panel de gestión de alertamientos"
            X: =Parent.Width*0.04
            Y: =Parent.Height*0.95
            Width: =400
            Height: =30
            Color: =RGBA(84,32,168,1)
            Size: =12
