If(
    !varBuscar,
    Tabla1,
    Filter(
        Tabla1,
        (ddAnalista.Selected.Value = "Todos" || IsBlank(ddAnalista.Selected.Value) || Upper(Trim(AnalistaAsignado)) = Upper(Trim(ddAnalista.Selected.Value))) &&
        (ddSponsor.Selected.Value = "Todos" || IsBlank(ddSponsor.Selected.Value) || Upper(Trim(Sponsor)) = Upper(Trim(ddSponsor.Selected.Value))) &&
        (ddArea.Selected.Value = "Todas" || IsBlank(ddArea.Selected.Value) || Upper(Trim(Area)) = Upper(Trim(ddArea.Selected.Value))) &&
        (ddCausal.Selected.Value = "Todas" || IsBlank(ddCausal.Selected.Value) || Upper(Trim(Causal)) = Upper(Trim(ddCausal.Selected.Value))) &&
        (ddSubcausal.Selected.Value = "Todas" || IsBlank(ddSubcausal.Selected.Value) || Upper(Trim(Subcausal)) = Upper(Trim(ddSubcausal.Selected.Value))) &&
        (ddResponsable.Selected.Value = "Todos" || IsBlank(ddResponsable.Selected.Value) || Upper(Trim(ResponsableOperativo)) = Upper(Trim(ddResponsable.Selected.Value))) &&
        (ddEstado.Selected.Value = "Todos" || IsBlank(ddEstado.Selected.Value) || Upper(Trim(Estado)) = Upper(Trim(ddEstado.Selected.Value))) &&
        (
            IsBlank(dpDesde.SelectedDate) || 
            Date(
                Value(Año),
                Switch(
                    Lower(Trim(Mes)),
                    "enero", 1,
                    "febrero", 2,
                    "marzo", 3,
                    "abril", 4,
                    "mayo", 5,
                    "junio", 6,
                    "julio", 7,
                    "agosto", 8,
                    "septiembre", 9,
                    "setiembre", 9,
                    "octubre", 10,
                    "noviembre", 11,
                    "diciembre", 12,
                    1
                ),
                Value(Dia)
            ) >= dpDesde.SelectedDate
        )
    )
)
