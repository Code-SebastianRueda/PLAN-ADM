      - galCasos:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =Sort(
                  Filter(
                      colCasos,
                      (IsBlank(cmbFAnalista.Selected.Value) || 'ANALISTA ENCARGADA UAC' = cmbFAnalista.Selected.Value) &&
                      (IsBlank(cmbFSponsor.Selected.Value) || SPONSOR = cmbFSponsor.Selected.Value) &&
                      (IsBlank(cmbFArea.Selected.Value) || 'ÁREA ENCARGADA' = cmbFArea.Selected.Value) &&
                      (IsBlank(cmbFCausal.Selected.Value) || CASUAL = cmbFCausal.Selected.Value) &&
                      (IsBlank(cmbFSubcausal.Selected.Value) || SUBCASUAL = cmbFSubcausal.Selected.Value) &&
                      (IsBlank(cmbFEstado.Selected.Value) || Upper(ESTADO) = cmbFEstado.Selected.Value) &&
                      (IsBlank(dpDesde.SelectedDate) || Fecha >= dpDesde.SelectedDate) &&
                      (IsBlank(dpHasta.SelectedDate) || Fecha <= dpHasta.SelectedDate)
                  ),
                  IdNum,
                  SortOrder.Descending
              )
            TemplateSize: =30
            TemplatePadding: =0
            TemplateFill: =If(ThisItem.IsSelected, clrClaro, Color.White)
            OnSelect: |-
              =Set(varCaso, ThisItem);
              Navigate(scrSolucionarCaso, ScreenTransition.Fade)
            X: =20
            Y: =490
            Width: =Parent.Width - 40
            Height: =Parent.Height - 495
          Children:
            - lnFila:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(225, 228, 235, 1)
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
            - celId:
