//  Requiere la conexión al Excel (Excel Online Business) con todas sus tablas:
//  TablaCasos, tblHistorial, tblUsuarios, tblCat*, tblConfig.
//  Formato ESPAÑOL: ';' separa argumentos y ';;' termina cada definición.
// =============================================================================
 
