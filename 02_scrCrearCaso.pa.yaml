Screens:
  scrCrearCaso:
    Properties:
      Fill: =clrFondo
      OnVisible: |-
        =Reset(cmbAnalistaUAC);
        Reset(cmbAsignado);
        Reset(cmbSponsor);
        Reset(cmbArea);
        Reset(cmbCausal);
        Reset(cmbSubcausal);
        Reset(txtResponsable);
        Reset(dpFechaInicial);
        Reset(txtDescripcion);
        Reset(txtPlanInicial)
    Children:
      # ================= ENCABEZADO =================
      - recHeaderC:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =clrPrimario
            Width: =Parent.Width
            Height: =50
      - lblLogoC:
          Control: Label@2.5.1
          Properties:
            Text: ="CHUBB"
            Color: =Color.White
            FontWeight: =FontWeight.Bold
            Size: =18
            X: =20
            Width: =300
            Height: =50
      - recBarraC:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =clrClaro
            Y: =50
            Width: =Parent.Width
            Height: =44
      - btnVolverC:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="‹ Volver"
            OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
            Fill: =Color.White
            Color: =clrPrimario
            BorderColor: =clrPrimario
            BorderThickness: =1
            HoverFill: =clrClaro
            Size: =12
            X: =20
            Y: =56
            Width: =110
            Height: =32
      - lblTituloC:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="Crear Caso: Nuevo  (ID " & (Coalesce(Max(colCasos, IdNum), 0) + 1) & ")"
            Color: =clrPrimario
            FontWeight: =FontWeight.Semibold
            Size: =18
            X: =150
            Y: =50
            Width: =800
            Height: =44

      # ================= COLUMNA IZQUIERDA =================
      # 1. Analista encargada UAC
      - lblAnalistaUAC:
          Control: Label@2.5.1
          Properties:
            Text: ="1. Analista encargada UAC *"
            Size: =12
            X: =40
            Y: =105
            Width: =600
            Height: =28
      - cmbAnalistaUAC:
          Control: Classic/ComboBox@2.4.0
          Properties:
            Items: |-
              =Sort(
                  Distinct(
                      Filter(Distinct(colCasos, 'ANALISTA ENCARGADA UAC'), !IsBlank(Value)),
                      Value
                  ),
                  Value
              )
            DisplayFields: =["Value"]
            SearchFields: =["Value"]
            SelectMultiple: =false
            InputTextPlaceholder: ="Seleccione..."
            X: =40
            Y: =133
            Width: =600
            Height: =36

      # 2. Analista asignado (responsable de la ejecución)
      - lblAsignado:
          Control: Label@2.5.1
          Properties:
            Text: ="2. Asigne al responsable de la ejecución (Analista asignado) *"
            Size: =12
            X: =40
            Y: =180
            Width: =600
            Height: =28
      - cmbAsignado:
          Control: Classic/ComboBox@2.4.0
          Properties:
            Items: |-
              =Sort(
                  Distinct(
                      Filter(Distinct(colCasos, 'ANALISTA ASIGANDO'), !IsBlank(Value)),
                      Value
                  ),
                  Value
              )
            DisplayFields: =["Value"]
            SearchFields: =["Value"]
            SelectMultiple: =false
            InputTextPlaceholder: ="Seleccione..."
            X: =40
            Y: =208
            Width: =600
            Height: =36

      # 3. Sponsor
      - lblSponsor:
          Control: Label@2.5.1
          Properties:
            Text: ="3. Sponsor *"
            Size: =12
            X: =40
            Y: =255
            Width: =600
            Height: =28
      - cmbSponsor:
          Control: Classic/ComboBox@2.4.0
          Properties:
            Items: |-
              =Sort(
                  Distinct(
                      Filter(Distinct(colCasos, SPONSOR), !IsBlank(Value)),
                      Value
                  ),
                  Value
              )
            DisplayFields: =["Value"]
            SearchFields: =["Value"]
            SelectMultiple: =false
            InputTextPlaceholder: ="Seleccione..."
            X: =40
            Y: =283
            Width: =600
            Height: =36

      # 4. Área encargada
      - lblArea:
          Control: Label@2.5.1
          Properties:
            Text: ="4. Área encargada *"
            Size: =12
            X: =40
            Y: =330
            Width: =600
            Height: =28
      - cmbArea:
          Control: Classic/ComboBox@2.4.0
          Properties:
            Items: |-
              =Sort(
                  Distinct(
                      Filter(Distinct(colCasos, 'ÁREA ENCARGADA'), !IsBlank(Value)),
                      Value
                  ),
                  Value
              )
            DisplayFields: =["Value"]
            SearchFields: =["Value"]
            SelectMultiple: =false
            InputTextPlaceholder: ="Seleccione..."
            X: =40
            Y: =358
            Width: =600
            Height: =36

      # 5. Causal (motivo)
      - lblCausal:
          Control: Label@2.5.1
          Properties:
            Text: ="5. Seleccione el motivo (Causal) *"
            Size: =12
            X: =40
            Y: =405
            Width: =600
            Height: =28
      - cmbCausal:
          Control: Classic/ComboBox@2.4.0
          Properties:
            Items: |-
              =Sort(
                  Distinct(
                      Filter(Distinct(colCasos, CASUAL), !IsBlank(Value)),
                      Value
                  ),
                  Value
              )
            DisplayFields: =["Value"]
            SearchFields: =["Value"]
            SelectMultiple: =false
            InputTextPlaceholder: ="Seleccione..."
            OnChange: =Reset(cmbSubcausal)
            X: =40
            Y: =433
            Width: =600
            Height: =36

      # 6. Subcausal (sub motivo)
      - lblSubcausal:
          Control: Label@2.5.1
          Properties:
            Text: ="6. Seleccione el sub motivo (Subcausal) *"
            Size: =12
            X: =40
            Y: =480
            Width: =600
            Height: =28
      - cmbSubcausal:
          Control: Classic/ComboBox@2.4.0
          Properties:
            Items: |-
              =Sort(
                  Distinct(
                      Filter(
                          Distinct(Filter(colCasos, CASUAL = cmbCausal.Selected.Value), SUBCASUAL),
                          !IsBlank(Value)
                      ),
                      Value
                  ),
                  Value
              )
            DisplayFields: =["Value"]
            SearchFields: =["Value"]
            SelectMultiple: =false
            InputTextPlaceholder: ="Seleccione..."
            DisplayMode: =If(IsBlank(cmbCausal.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit)
            X: =40
            Y: =508
            Width: =600
            Height: =36

      # 7. Responsable operativo del alertamiento
      - lblResponsable:
          Control: Label@2.5.1
          Properties:
            Text: ="7. Responsable operativo del alertamiento *"
            Size: =12
            X: =40
            Y: =555
            Width: =600
            Height: =28
      - txtResponsable:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            HintText: ="Nombre del responsable operativo"
            Size: =12
            X: =40
            Y: =583
            Width: =600
            Height: =36

      # ================= COLUMNA DERECHA =================
      # 8. Fecha inicial
      - lblFechaInicial:
          Control: Label@2.5.1
          Properties:
            Text: ="8. Fecha inicial del alertamiento *"
            Size: =12
            X: =720
            Y: =105
            Width: =600
            Height: =28
      - dpFechaInicial:
          Control: Classic/DatePicker@2.6.0
          Properties:
            DefaultDate: =Today()
            Format: ="dd/mm/yyyy"
            X: =720
            Y: =133
            Width: =300
            Height: =36

      # 9. Descripción del riesgo (problemática)
      - lblDescripcion:
          Control: Label@2.5.1
          Properties:
            Text: ="9. Escriba la problemática (Descripción del riesgo) *"
            Size: =12
            X: =720
            Y: =180
            Width: =600
            Height: =28
      - txtDescripcion:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            Mode: =TextMode.MultiLine
            HintText: ="Describa el riesgo / problemática detectada"
            Size: =12
            X: =720
            Y: =208
            Width: =600
            Height: =160

      # 10. Plan de acción inicial (opcional)
      - lblPlanInicial:
          Control: Label@2.5.1
          Properties:
            Text: ="10. Plan de acción inicial (Opcional) / Cuadro de respuesta"
            Size: =12
            X: =720
            Y: =380
            Width: =600
            Height: =28
      - txtPlanInicial:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            Mode: =TextMode.MultiLine
            HintText: ="Opcional"
            Size: =12
            X: =720
            Y: =408
            Width: =600
            Height: =130

      # ================= BOTONES =================
      - btnCancelarC:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Cancelar"
            OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
            Fill: =Color.White
            Color: =clrPrimario
            BorderColor: =clrPrimario
            BorderThickness: =1
            HoverFill: =clrClaro
            Size: =13
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            X: =940
            Y: =570
            Width: =160
            Height: =48
      - btnEnviarCaso:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Enviar Caso"
            DisplayMode: |-
              =If(
                  !IsBlank(cmbAnalistaUAC.Selected.Value) &&
                  !IsBlank(cmbAsignado.Selected.Value) &&
                  !IsBlank(cmbSponsor.Selected.Value) &&
                  !IsBlank(cmbArea.Selected.Value) &&
                  !IsBlank(cmbCausal.Selected.Value) &&
                  !IsBlank(cmbSubcausal.Selected.Value) &&
                  !IsBlank(Trim(txtResponsable.Text)) &&
                  !IsBlank(dpFechaInicial.SelectedDate) &&
                  !IsBlank(Trim(txtDescripcion.Text)),
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            OnSelect: |-
              =With(
                  {wId: Coalesce(Max(colCasos, IdNum), 0) + 1},
                  IfError(
                      Patch(
                          TablaCasos,
                          Defaults(TablaCasos),
                          {
                              'ID CASO': Text(wId),
                              DIA: Text(Day(dpFechaInicial.SelectedDate)),
                              MES: Upper(Text(dpFechaInicial.SelectedDate, "mmmm", "es-ES")),
                              'AÑO': Text(Year(dpFechaInicial.SelectedDate)),
                              'ANALISTA ENCARGADA UAC': cmbAnalistaUAC.Selected.Value,
                              SPONSOR: cmbSponsor.Selected.Value,
                              'ÁREA ENCARGADA': cmbArea.Selected.Value,
                              'ANALISTA ASIGANDO': cmbAsignado.Selected.Value,
                              CASUAL: cmbCausal.Selected.Value,
                              SUBCASUAL: cmbSubcausal.Selected.Value,
                              'RESPONSABLE OPERATIVO DEL ALERTAMIENTO': Trim(txtResponsable.Text),
                              'DESCRIPCION DEL RIESGO': Trim(txtDescripcion.Text),
                              'AVANCES DEL CASO': "",
                              'PLAN DE ACCION': Trim(txtPlanInicial.Text),
                              ESTADO: "ABIERTO"
                          }
                      ),
                      Notify("No se pudo guardar el caso: " & FirstError.Message, NotificationType.Error),
                      Notify("Caso " & wId & " creado correctamente", NotificationType.Success, 3000);
                      Navigate(scrDashboard, ScreenTransition.Fade)
                  )
              )
            Fill: =clrVerde
            Color: =Color.White
            HoverFill: =ColorFade(clrVerde, -0.15)
            DisabledFill: =RGBA(190, 200, 190, 1)
            Size: =14
            RadiusTopLeft: =22
            RadiusTopRight: =22
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            X: =1120
            Y: =570
            Width: =200
            Height: =48
      - lblObligatorios:
          Control: Label@2.5.1
          Properties:
            Text: ="* Campos obligatorios. El caso se crea con estado 'ABIERTO'."
            Size: =11
            Italic: =true
            Color: =RGBA(90, 90, 100, 1)
            X: =720
            Y: =630
            Width: =600
            Height: =30
