With(
    {wId: Coalesce(Max(colCasos; IdNum); 0) + 1};
    IfError(
        Patch(
            TablaCasos;
            Defaults(TablaCasos);
            {
                'ID CASO': wId;
                DIA: Day(dpFechaInicial.SelectedDate);
                MES: Upper(Text(dpFechaInicial.SelectedDate; "mmmm"; "es-ES"));
                'AÑO': Year(dpFechaInicial.SelectedDate);
                'ANALISTA ENCARGADA UAC': cmbAnalistaUAC.Selected.Value;
                SPONSOR: cmbSponsor.Selected.Value;
                'ÁREA ENCARGADA': cmbArea.Selected.Value;
                'ANALISTA ASIGANDO': cmbAsignado.Selected.Value;
                CASUAL: cmbCausal.Selected.Value;
                SUBCASUAL: cmbSubcausal.Selected.Value;
                'RESPONSABLE OPERATIVO DEL ALERTAMIENTO': Trim(txtResponsable.Text);
                'DESCRIPCION DEL RIESGO': Trim(txtDescripcion.Text);
                'AVANCES DEL CASO': "";
                'PLAN DE ACCION': Trim(txtPlanInicial.Text);
                ESTADO: "ABIERTO"
            }
        );
        Notify("No se pudo guardar el caso: " & FirstError.Message; NotificationType.Error);
        Notify("Caso " & wId & " creado correctamente"; NotificationType.Success; 3000);;
        Navigate(scrDashboard; ScreenTransition.Fade)
    )
)
