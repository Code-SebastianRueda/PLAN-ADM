With(
    {
        wCaso: cmbCasoSel.Selected;
        wCerrado: ddEstado.Selected.Value = "CERRADO"
    };
    IfError(
        Patch(
            TablaCasos;
            LookUp(TablaCasos; 'ID CASO' = wCaso.'ID CASO');
            {
                ESTADO: ddEstado.Selected.Value;
                'PLAN DE ACCION': Trim(txtAccion.Text);
                'AVANCES DEL CASO': Trim(txtDetalle.Text);
                'MES DE CIERRE DEL CASO': If(
                    wCerrado;
                    If(Upper(wCaso.ESTADO) = "CERRADO" && !IsBlank(wCaso.'MES DE CIERRE DEL CASO'); wCaso.'MES DE CIERRE DEL CASO'; Upper(Text(Today(); "mmmm"; "es-ES")));
                    Blank()
                );
                'AÑO DE CIERRE DEL CASO': If(
                    wCerrado;
                    If(Upper(wCaso.ESTADO) = "CERRADO" && !IsBlank(wCaso.'AÑO DE CIERRE DEL CASO'); wCaso.'AÑO DE CIERRE DEL CASO'; Year(Today()));
                    Blank()
                );
                'EL PLAN DE ACCION SOLUCIONÓ EL PROBLEMA DE RAIZ': If(wCerrado; ddRaiz.Selected.Value; "")
            }
        );
        Notify("No se pudo guardar: " & FirstError.Message; NotificationType.Error);
        Notify("Caso " & wCaso.IdNum & " actualizado (" & ddEstado.Selected.Value & ")"; NotificationType.Success; 3000);;
        Set(varCaso; Blank());;
        Navigate(scrDashboard; ScreenTransition.Fade)
    )
)
