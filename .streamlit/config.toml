[theme]
base                = "light"
primaryColor        = "#0050A0"
backgroundColor     = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor           = "#1A1A2E"
font                = "sans serif"

[browser]
gatherUsageStats    = false

[server]
headless            = true
address             = "0.0.0.0"
port                = 8501
enableXsrfProtection = true
maxUploadSize       = 50
